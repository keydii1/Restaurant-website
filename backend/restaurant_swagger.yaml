openapi: 3.0.4
info:
  title: Restaurant Management API
  description: |-
    API documentation for Restaurant Management System.
    This API provides endpoints for managing dishes, categories, users, orders, tables, discounts, blogs, and more.

    Features:
    - User authentication and authorization
    - Dish and category management
    - Shopping cart functionality
    - Table reservations
    - Discount codes
    - Blog management
    - Contact form handling
  contact:
    email: support@restaurant.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: http://localhost:3000/restaurant/api/v1
    description: Development server
  - url: https://restaurant-website-s8zb.onrender.com/restaurant/api/v1
    description: Production server
tags:
  - name: users
    description: Quản lý người dùng và xác thực
  - name: dishes
    description: Quản lý món ăn
  - name: categories
    description: Quản lý danh mục món ăn
  - name: carts
    description: Quản lý giỏ hàng
  - name: orders
    description: Quản lý đơn hàng
  - name: tables
    description: Quản lý bàn
  - name: discounts
    description: Quản lý mã giảm giá
  - name: blogs
    description: Quản lý blog
  - name: contacts
    description: Quản lý liên hệ

paths:
  # ===== USER ENDPOINTS =====
  /users:
    get:
      tags:
        - users
      summary: Lấy danh sách người dùng
      description: Lấy danh sách tất cả người dùng (Chỉ admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /users/register:
    post:
      tags:
        - users
      summary: Đăng ký tài khoản
      description: Tạo tài khoản người dùng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAuthentication"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /users/login:
    post:
      tags:
        - users
      summary: Đăng nhập
      description: Đăng nhập vào hệ thống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAuthentication"
        "401":
          description: Email hoặc mật khẩu không đúng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAuthentication"

  /users/forgot-password:
    post:
      tags:
        - users
      summary: Quên mật khẩu
      description: Gửi OTP để đặt lại mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        "200":
          description: OTP đã được gửi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /users/verify-otp:
    post:
      tags:
        - users
      summary: Xác thực OTP
      description: Xác thực mã OTP để đặt lại mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: OTP hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /users/reset-password:
    patch:
      tags:
        - users
      summary: Đặt lại mật khẩu
      description: Đặt lại mật khẩu mới sau khi xác thực OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /users/logout:
    get:
      tags:
        - users
      summary: Đăng xuất
      description: Đăng xuất khỏi hệ thống
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/refresh-token:
    post:
      tags:
        - users
      summary: Làm mới token
      description: Tạo access token mới từ refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/auth/google:
    get:
      tags:
        - users
      summary: Đăng nhập Google
      description: Chuyển hướng đến trang đăng nhập Google
      responses:
        "302":
          description: Chuyển hướng đến Google OAuth

  /users/auth/google/callback:
    get:
      tags:
        - users
      summary: Callback Google OAuth
      description: Xử lý callback từ Google OAuth
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAuthentication"

  # ===== DISH ENDPOINTS =====
  /dishes:
    get:
      tags:
        - dishes
      summary: Lấy danh sách món ăn
      description: Lấy danh sách tất cả món ăn với phân trang
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /dishes/create:
    post:
      tags:
        - dishes
      summary: Tạo món ăn mới
      description: Tạo món ăn mới (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DishCreateBody"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /dishes/detail/{id}:
    get:
      tags:
        - dishes
      summary: Lấy chi tiết món ăn
      description: Lấy thông tin chi tiết của một món ăn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /dishes/edit/{id}:
    patch:
      tags:
        - dishes
      summary: Cập nhật món ăn
      description: Cập nhật thông tin món ăn (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DishUpdateBody"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /dishes/delete/{id}:
    delete:
      tags:
        - dishes
      summary: Xóa món ăn
      description: Xóa món ăn (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /dishes/change-status/{id}/{status}:
    patch:
      tags:
        - dishes
      summary: Thay đổi trạng thái món ăn
      description: Thay đổi trạng thái món ăn (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: status
          required: true
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /dishes/change-multi:
    patch:
      tags:
        - dishes
      summary: Thay đổi nhiều món ăn
      description: Thay đổi trạng thái hoặc xóa nhiều món ăn cùng lúc (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                type:
                  type: string
                  enum: [change-status, delete]
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  # ===== CATEGORY ENDPOINTS =====
  /categories:
    get:
      tags:
        - categories
      summary: Lấy danh sách danh mục
      description: Lấy danh sách tất cả danh mục
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /categories/create:
    post:
      tags:
        - categories
      summary: Tạo danh mục mới
      description: Tạo danh mục mới (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CategoryCreateBody"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /categories/edit/{id}:
    patch:
      tags:
        - categories
      summary: Cập nhật danh mục
      description: Cập nhật thông tin danh mục (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CategoryUpdateBody"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /categories/delete/{id}:
    delete:
      tags:
        - categories
      summary: Xóa danh mục
      description: Xóa danh mục (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /categories/change-status/{id}/{status}:
    patch:
      tags:
        - categories
      summary: Thay đổi trạng thái danh mục
      description: Thay đổi trạng thái danh mục (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: status
          required: true
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /categories/change-multi:
    patch:
      tags:
        - categories
      summary: Thay đổi nhiều danh mục
      description: Thay đổi trạng thái hoặc xóa nhiều danh mục cùng lúc (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                type:
                  type: string
                  enum: [change-status, delete]
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  # ===== CART ENDPOINTS =====
  /carts:
    get:
      tags:
        - carts
      summary: Lấy giỏ hàng
      description: Lấy giỏ hàng của người dùng hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /carts/add:
    post:
      tags:
        - carts
      summary: Thêm món vào giỏ hàng
      description: Thêm món ăn vào giỏ hàng (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dishId
                - quantity
              properties:
                dishId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Thêm thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /carts/clear:
    delete:
      tags:
        - carts
      summary: Xóa toàn bộ giỏ hàng
      description: Xóa tất cả món trong giỏ hàng (Chỉ admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /carts/change:
    post:
      tags:
        - carts
      summary: Thay đổi số lượng món trong giỏ
      description: Thay đổi số lượng hoặc xóa món khỏi giỏ hàng (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dishId
                - quantity
              properties:
                dishId:
                  type: string
                quantity:
                  type: integer
                  description: Đặt 0 để xóa món khỏi giỏ
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  # ===== BLOG ENDPOINTS =====
  /blogs:
    get:
      tags:
        - blogs
      summary: Lấy danh sách blog
      description: Lấy danh sách tất cả blog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /blogs/create:
    post:
      tags:
        - blogs
      summary: Tạo blog mới
      description: Tạo blog mới (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BlogCreateBody"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /blogs/edit/{id}:
    patch:
      tags:
        - blogs
      summary: Cập nhật blog
      description: Cập nhật thông tin blog (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BlogUpdateBody"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /blogs/delete/{id}:
    delete:
      tags:
        - blogs
      summary: Xóa blog
      description: Xóa blog (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ===== TABLE ENDPOINTS =====
  /tables:
    get:
      tags:
        - tables
      summary: Lấy danh sách bàn
      description: Lấy danh sách tất cả bàn
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tables/create:
    post:
      tags:
        - tables
      summary: Tạo bàn mới
      description: Tạo bàn mới (Chỉ admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCreateBody"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /tables/edit/{id}:
    patch:
      tags:
        - tables
      summary: Cập nhật thông tin bàn
      description: Cập nhật thông tin bàn (Chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
