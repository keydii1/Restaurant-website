components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ===== USER SCHEMAS =====
    RegisterBody:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "Password123!"
        phoneNumber:
          type: string
          example: "+84123456789"
        address:
          type: string
          example: "123 Main St, City"
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-01"

    LoginBody:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "hoson2k5@gmail.com"
        password:
          type: string
          format: password
          example: "Password123!"

    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        isAdmin:
          type: boolean
        loginMethod:
          type: string
          enum: [manual, google]
        googleId:
          type: string
        refreshToken:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsersResponse:
      type: object
      properties:
        message:
          type: string
          example: "Success"
        statusCode:
          type: integer
          example: 200
        metadata:
          type: array
          items:
            $ref: "#/components/schemas/User"
      example:
        message: "Success"
        statusCode: 200
        metadata:
          - _id: "690f65074d5fb8590ae9c0f6"
            username: "hohoangson"
            email: "hoson2k5@gmail.com"
            avatar: "https://res.cloudinary.com/dvxaznogb/image/upload/v1234567890/avatars/user.jpg"
            address: "123 Đường ABC, Quận 1, TP.HCM"
            phoneNumber: "+84123456789"
            dateOfBirth: "2000-05-15"
            isAdmin: false
            loginMethod: "manual"
            googleId: null
            refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            createdAt: "2024-11-05T08:30:00.000Z"
            updatedAt: "2024-11-28T09:15:30.000Z"

    SuccessAuthentication:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        statusCode:
          type: integer
          example: 200
        metadata:
          type: object
          properties:
            accessToken:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                username:
                  type: string
                email:
                  type: string
                isAdmin:
                  type: boolean
      example:
        message: "Login successful"
        statusCode: 200
        metadata:
          accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5MGY2NTA3NGQ1ZmI4NTkwYWU5YzBmNiIsImVtYWlsIjoiaG9zb24yazVAZ21haWwuY29tIiwidXNlcm5hbWUiOiJob2hvYW5nc29uIiwiaXNBZG1pbiI6ZmFsc2UsImlhdCI6MTczMjc4OTIzMCwiZXhwIjoxNzMyODc1NjMwfQ.abc123..."
          user:
            id: "690f65074d5fb8590ae9c0f6"
            username: "hohoangson"
            email: "hoson2k5@gmail.com"
            isAdmin: false

    ErrorAuthentication:
      type: object
      properties:
        message:
          type: string
          example: "Password is incorrect"
        statusCode:
          type: integer
          example: 400

    # ===== DISH SCHEMAS =====
    Dish:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discount:
          type: number
        image:
          type: string
        categoryId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Category"
        status:
          type: string
          enum: [active, inactive]
        finalPrice:
          type: number
        rating:
          type: number
        position:
          type: integer
        bestSeller:
          type: boolean
        ingredients:
          type: array
          items:
            type: string
        prepareTime:
          type: integer
        deleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DishCreateBody:
      type: object
      required:
        - name
        - price
        - categoryId
      properties:
        name:
          type: string
          example: "Bún Bò Huế"
        description:
          type: string
          example: "Món bún bò Huế đậm đà hương vị miền Trung"
        price:
          type: number
          example: 50000
        discount:
          type: number
          example: 0
        categoryId:
          type: string
          example: "69278a9914e21390ef18de8d"
        image:
          type: string
          format: binary
        ingredients:
          type: string
          description: "JSON string array của ingredients"
          example: '["Thịt bò", "Bún", "Sả", "Mắm tôm"]'
        prepareTime:
          type: integer
          example: 20
        bestSeller:
          type: boolean
          example: false
        rating:
          type: number
          example: 0
        status:
          type: string
          enum: [active, inactive]
          example: "active"

    DishUpdateBody:
      type: object
      properties:
        name:
          type: string
          example: "Bún Bò Huế Đặc Biệt"
        description:
          type: string
          example: "Món bún bò Huế đậm đà hương vị miền Trung với nhiều topping"
        price:
          type: number
          example: 60000
        discount:
          type: number
          example: 10
        categoryId:
          type: string
          example: "69278a9914e21390ef18de8d"
        image:
          type: string
          format: binary
        status:
          type: string
          enum: [active, inactive]
          example: "active"
        ingredients:
          type: string
          description: "JSON string array của ingredients"
          example: '["Thịt bò", "Chả bò", "Bún", "Sả", "Mắm tôm", "Rau sống"]'
        prepareTime:
          type: integer
          example: 25
        bestSeller:
          type: boolean
          example: true
        rating:
          type: number
          example: 4.8

    DishesResponse:
      type: object
      properties:
        message:
          type: string
          example: "Dishes fetched successfully"
        statusCode:
          type: integer
          example: 200
        metadata:
          type: object
          properties:
            dishes:
              type: array
              items:
                $ref: "#/components/schemas/Dish"
            totalPages:
              type: integer
            currentPage:
              type: integer
      example:
        message: "Dishes fetched successfully"
        statusCode: 200
        metadata:
          dishes:
            - _id: "69278bdb14e21390ef18de93"
              name: "Phở Bò Tái"
              description: "Món phở bò truyền thống với thịt bò tái mềm"
