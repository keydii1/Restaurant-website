components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ===== USER SCHEMAS =====
    RegisterBody:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123
        phoneNumber:
          type: string
          example: "+84123456789"
        address:
          type: string
          example: "123 Main St, City"
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-01"

    LoginBody:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123

    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        isAdmin:
          type: boolean
        loginMethod:
          type: string
          enum: [manual, google]
        googleId:
          type: string
        refreshToken:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsersResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
      example:
        code: 200
        message: Success
        data:
          - _id: "64f1b2c3d4e5f6789a0b1c39"
            username: "johndoe"
            email: "johndoe@example.com"
            avatar: "https://example.com/avatar.jpg"
            address: "123 Main St"
            phoneNumber: "+1234567890"
            dateOfBirth: "1990-01-01"
            isAdmin: false
            loginMethod: "manual"
            googleId: null
            refreshToken: "refresh_token_here"
            createdAt: "2023-09-01T10:00:00.000Z"
            updatedAt: "2023-09-01T10:00:00.000Z"

    SuccessAuthentication:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: "#/components/schemas/User"
      example:
        code: 200
        message: Login successful
        data:
          accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          refreshToken: "refresh_token_here"
          user:
            _id: "64f1b2c3d4e5f6789a0b1c39"
            username: "johndoe"
            email: "johndoe@example.com"
            avatar: "https://example.com/avatar.jpg"
            address: "123 Main St"
            phoneNumber: "+1234567890"
            dateOfBirth: "1990-01-01"
            isAdmin: false
            loginMethod: "manual"
            googleId: null
            refreshToken: "refresh_token_here"
            createdAt: "2023-09-01T10:00:00.000Z"
            updatedAt: "2023-09-01T10:00:00.000Z"

    ErrorAuthentication:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Email or password is incorrect

    # ===== DISH SCHEMAS =====
    Dish:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discount:
          type: number
        image:
          type: string
        categoryId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Category"
        status:
