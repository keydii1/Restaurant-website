      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          $ref: "#/components/schemas/Role"

    # ===== ORDER SCHEMAS =====
    OrdersResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: array
          items:
            type: object

    # ===== PAYMENT SCHEMAS =====
    PaymentCreateBody:
      type: object
      required:
        - amount
        - method
      properties:
        amount:
          type: number
        method:
          type: string
          enum: [cash, card, online]
        orderId:
          type: string

    PaymentResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            paymentId:
              type: string
            status:
              type: string

    # ===== COMMON SCHEMAS =====
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object

  responses:
    UnauthorizedError:
      description: Chưa xác thực hoặc token không hợp lệ
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized

    ForbiddenError:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 403
              message:
                type: string
                example: Forbidden

    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
              message:
                type: string
                example: Not found

    BadRequestError:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              message:
                type: string
                example: Bad request
