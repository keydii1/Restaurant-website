components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ===== USER SCHEMAS =====
    RegisterBody:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123
        phoneNumber:
          type: string
          example: "+84123456789"
        address:
          type: string
          example: "123 Main St, City"
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-01"

    LoginBody:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123

    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        isAdmin:
          type: boolean
        loginMethod:
          type: string
          enum: [manual, google]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsersResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    SuccessAuthentication:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: "#/components/schemas/User"

    ErrorAuthentication:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Email or password is incorrect

    # ===== DISH SCHEMAS =====
    Dish:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discount:
          type: number
        image:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [active, inactive]
        finalPrice:
          type: number
        rating:
          type: number
        position:
          type: integer
        bestSeller:
          type: boolean
        ingredients:
          type: array
          items:
            type: string
        prepareTime:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DishCreateBody:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discount:
          type: number
        category:
          type: string
        image:
          type: string
          format: binary
        ingredients:
          type: string
          description: JSON string array
        prepareTime:
          type: integer
        bestSeller:
          type: boolean

    DishUpdateBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discount:
          type: number
        category:
          type: string
        image:
          type: string
          format: binary
        status:
          type: string
          enum: [active, inactive]
        ingredients:
          type: string
          description: JSON string array
        prepareTime:
          type: integer
        bestSeller:
          type: boolean

    DishesResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            dishes:
              type: array
              items:
                $ref: "#/components/schemas/Dish"
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer

    DishResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          $ref: "#/components/schemas/Dish"

